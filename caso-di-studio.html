*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;background:var(--sand);color:var(--ink);line-height:1.65}
#gate{position:fixed;inset:0;background:radial-gradient(1200px 700px at 70% -10%,#24365e,transparent),linear-gradient(160deg,#14213d,#0c1526);display:flex;align-items:center;justify-content:center;z-index:99}
.gate-card{background:#fff;border-radius:20px;padding:46px 42px;width:min(440px,92vw);text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.5)}

.gate-card h1{font-size:23px;color:var(--navy)}
.gate-card .sub{color:var(--grey);font-size:13.5px;margin:8px 0 22px;line-height:1.5}
.gate-card input{width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font-size:16px;text-align:center;letter-spacing:2px;outline:none}
.gate-card input:focus{border-color:var(--coral);box-shadow:0 0 0 4px rgba(230,57,70,.12)}
.go{width:100%;margin-top:14px;padding:14px;background:var(--coral);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}

header.hero{background:linear-gradient(160deg,#14213d,#0c1526);color:#fff;padding:52px clamp(18px,5vw,60px) 60px;position:relative;overflow:hidden}

.wrap{max-width:980px;margin:auto}
.kicker{color:var(--gold);font-weight:800;letter-spacing:2px;font-size:12.5px;text-transform:uppercase}
header.hero h1{font-size:clamp(27px,4.5vw,44px);line-height:1.15;margin:12px 0 14px}
.sub{color:#c7d0e2;font-size:clamp(15px,2vw,18px);max-width:740px}
.btns{display:flex;gap:12px;margin-top:26px;flex-wrap:wrap}
.btn{border-radius:12px;padding:13px 24px;font-weight:700;font-size:15px;text-decoration:none;display:inline-block}
.btn.gold{background:var(--gold);color:#14213d}

main{max-width:980px;margin:auto;padding:32px clamp(18px,5vw,60px) 80px}
.card{background:#fff;border-radius:18px;box-shadow:0 1px 4px rgba(0,0,0,.07);padding:28px 30px;margin:18px 0}
.card h2{color:var(--navy);font-size:22px;margin-bottom:10px}
.card h3{color:var(--navy);font-size:17px;margin:16px 0 6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
.kpi{background:var(--navy);color:#fff;border-radius:14px;padding:16px;text-align:center}
.kpi .v{font-size:30px;font-weight:800;color:var(--gold)}
.kpi .l{font-size:12px;color:#c7d0e2;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--navy)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:10px;padding:2px 10px;background:#eef1f7;color:var(--navy);margin:1px 2px}
ul{margin:8px 0 8px 20px}li{margin:6px 0}
.bar{background:#eef1f7;border-radius:8px;height:22px;margin:7px 0;position:relative;overflow:hidden}
.bar i{display:block;height:100%;border-radius:8px}
.bar span{position:absolute;left:10px;top:0;font-size:12px;font-weight:700;line-height:22px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.bar b{font-size:12.5px;color:var(--navy);margin-left:8px}
.tl{border-left:3px solid var(--gold);margin:12px 0 12px 6px;padding:0 0 0 18px}
.tl div{margin:10px 0}.tl b{color:var(--navy)}
.cta{background:linear-gradient(120deg,#14213d,#24365e);color:#fff;border-radius:18px;padding:32px;text-align:center;margin-top:26px}
.cta a{color:var(--gold);font-weight:700}
footer{text-align:center;color:#a8a396;font-size:12px;padding:26px}
details{background:#f8f6f1;border-radius:12px;padding:12px 16px;margin:8px 0}
summary{font-weight:700;color:var(--navy);cursor:pointer}
.small{font-size:13px;color:var(--grey)}
