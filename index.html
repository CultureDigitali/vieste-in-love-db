<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vieste in Love · Database Contatti</title>
<style>
:root{--navy:#14213d;--navy2:#1b2a4a;--coral:#e63946;--gold:#fca311;--sand:#f7f3ec;--ink:#242933;--grey:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f1ea;color:var(--ink)}
/* LOGIN */
#gate{position:fixed;inset:0;background:linear-gradient(160deg,#14213d,#0e182e);display:flex;align-items:center;justify-content:center;z-index:50}
.gate-card{background:#fff;border-radius:18px;padding:44px 40px;width:min(430px,92vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.heart{width:56px;height:50px;margin:0 auto 14px;background:var(--coral);clip-path:path('M28 48 C8 34 0 22 0 13 C0 4 7 0 14 0 C20 0 25 3 28 9 C31 3 36 0 42 0 C49 0 56 4 56 13 C56 22 48 34 28 48 Z')}
h1{color:var(--navy);font-size:26px;margin-bottom:4px}
.sub{color:var(--grey);font-size:13px;margin-bottom:22px}
input[type=password]{width:100%;padding:13px 15px;border:2px solid #e3ddd2;border-radius:10px;font-size:16px;text-align:center;outline:none}
input:focus{border-color:var(--coral)}
button.go{width:100%;margin-top:14px;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer}
button.go:hover{background:#0e182e}
.err{color:var(--coral);font-size:13px;margin-top:10px;min-height:18px}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r 1s linear infinite;vertical-align:-3px;margin-right:6px;display:none}
@keyframes r{to{transform:rotate(360deg)}}
/* APP */
header{background:var(--navy);color:#fff;padding:18px clamp(14px,4vw,34px);position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:19px}.logo b{color:var(--gold)}
.stats{margin-left:auto;font-size:12.5px;color:#cfd6e4}
.stats b{color:var(--gold)}
input.q{flex:1;min-width:220px;padding:11px 16px;border-radius:24px;border:none;font-size:15px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px clamp(14px,4vw,34px) 4px;background:var(--navy)}
.chip{white-space:nowrap;background:rgba(255,255,255,.12);color:#e8ecf5;border:none;border-radius:16px;padding:6px 14px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--coral);color:#fff}
main{padding:18px clamp(10px,3vw,30px) 60px;max-width:1500px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07);border-left:4px solid var(--gold);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(20,33,61,.14)}
.nm{font-weight:700;color:var(--navy);font-size:15.5px;line-height:1.25}
.badges{margin:7px 0 10px;display:flex;flex-wrap:wrap;gap:6px}
.bg{font-size:11px;padding:2px 9px;border-radius:11px;background:#eef1f7;color:#4a5568}
.bg.src{background:#fdf0dd;color:#8a6d1f}
.btns{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.b{font-size:13px;text-decoration:none;border-radius:8px;padding:7px 13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.b.wa{background:#25d366;color:#fff}.b.em{background:var(--navy);color:#fff}
.b.web{background:#eef1f7;color:var(--navy)}.b.ig{background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#bc1888);color:#fff}
.b.tel{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.empty{text-align:center;color:var(--grey);padding:60px 0;font-size:15px}
footer{text-align:center;color:#9aa1ad;font-size:12px;padding:26px}
</style></head><body>

}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function wa(t){return 'https://wa.me/39'+t}
function card(d,i){
 let b='';
 if(d.t&&/^3/.test(d.t)) b+=`<a class="b wa" target="_blank" href="${wa(d.t)}?text=${encodeURIComponent('Buongiorno '+d.n+'! Sono lo staff di Vieste in Love (7-13 settembre).')}" rel="noopener">WhatsApp</a>`;
 if(d.t) b+=`<a class="b tel" href="tel:+39${d.t}">📞 ${esc(d.t)}</a>`;
 if(d.e) b+=`<a class="b em" href="mailto:${esc(d.e)}?subject=${encodeURIComponent('Vieste in Love 2026 — Vieste Capitale dell\'Amore')}">✉️ Email</a>`;
 if(d.i) b+=`<a class="b ig" target="_blank" rel="noopener" href="https://instagram.com/${encodeURIComponent(d.i)}">IG @${esc(d.i)}</a>`;
 if(d.u) b+=`<a class="b web" target="_blank" rel="noopener" href="${esc(d.u)}">🌐 Sito</a>`;
 if(!b) b='<span style="color:#999;font-size:13px">Nessun recapito diretto — vedi fonte</span>';
 return `<div class="card"><div class="nm">${esc(d.n)}</div>
 <div class="badges">${d.c?`<span class="bg">${esc(d.c)}</span>`:''}<span class="bg src">📁 ${esc(d.s)}</span>${d.a?'<span class="bg" style="background:#fdecea;color:#c0392b">Love Menu target</span>':''}</div>
 <div class="btns">${b}</div></div>`;
}
function render(){
 if(!DATA)return;
 const q=document.getElementById("q").value.toLowerCase();
 const g=document.getElementById("grid");g.innerHTML='';
 let shown=0;
 DATA.forEach((d,i)=>{
  const hay=(d.n+' '+d.c+' '+d.s+' '+d.e+' '+(d.t||'')).toLowerCase();
  if(q&&!hay.includes(q))return;
  if(filter&&d.s!==filter)return;
  shown++;g.insertAdjacentHTML('beforeend',card(d,i));
 });
 document.getElementById("empty").style.display=shown?'none':'block';
 document.getElementById("stats").innerHTML=`<b>${shown}</b> / ${DATA.length} contatti`;
}
function openApp(){
 document.getElementById("gate").style.display="none";
 document.getElementById("hdr").style.display="block";
 const srcs=[...new Set(DATA.map(d=>d.s))];
 const chips=document.getElementById("chips");
 chips.innerHTML=`<button class="chip on" onclick="setF('',this)">Tutti (${DATA.length})</button>`+
  srcs.map(s=>`<button class="chip" onclick="setF('${esc(s).replace(/'/g,"\\'")}',this)">${esc(s.split(' · ')[0].replace('.xlsx',''))} (${DATA.filter(d=>d.s===s).length})</button>`).join('');
 render();document.getElementById("q").focus();
}
function setF(v,el){filter=v;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));el.classList.add('on');render()}
document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")tryOpen()});
(async()=>{ // auto-login se password gia in sessione
 const p=sessionStorage.getItem("vil_pw");
 if(p){document.getElementById("pw").value=p;await tryOpen();}
})();
</script></body></html>
